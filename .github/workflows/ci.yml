name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "claude/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This repo is a scaffold until the code is extracted into it. The code jobs
  # below are skipped (not failed) while there is nothing to build or scan.
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.find.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          if [ -f pyproject.toml ] || ls requirements*.in requirements*.txt >/dev/null 2>&1; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi
  ci:
    needs: detect
    if: needs.detect.outputs.code == 'true'
    uses: shamwari-ai/.github/.github/workflows/reusable-ci-python-piptools.yml@main
    with:
      import-check: "import main, ingest_ground; print(main.app.title, main.app.version)"

  secrets:
    uses: shamwari-ai/.github/.github/workflows/reusable-gitleaks.yml@main

  codeql:
    needs: detect
    if: needs.detect.outputs.code == 'true'
    uses: shamwari-ai/.github/.github/workflows/reusable-codeql.yml@main
    with:
      languages: '["python"]'
